[project]
name = "sshtemp"
version = "2026.9.1"
description = "Template-driven SSH automation using Paramiko invoke_shell"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Umur ARSLAN", email = "umurarslan@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "paramiko>=3.0,<6",
]
keywords = ["ssh", "paramiko", "network", "automation", "template", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
sshtemp = "sshtemp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sshtemp"]
